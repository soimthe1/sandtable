# Serves the built SPA and reverse-proxies /api to uvicorn in the SAME
# container (single-image build - see docker/Dockerfile).
#
# This is why the proxy target is 127.0.0.1 rather than a compose service
# name: api and ui are no longer separate containers, so there is no
# `backend` host to resolve.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Debian's nginx writes to /var/log/nginx/*.log by default, which nothing
    # outside the container ever reads. Send both to the container's stdio so
    # `docker compose logs` shows them.
    access_log /dev/stdout;
    error_log /dev/stderr;

    # SPA fallback - client-side routing (none yet in v1, but free to have)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # COA generation against a local model can genuinely take minutes -
        # the default 60s would cut a legitimate request off mid-flight.
        proxy_read_timeout 300s;
    }
}
