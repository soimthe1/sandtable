; Runs uvicorn and nginx side by side in the single production image.
;
; Logs go to stdout/stderr so `docker compose logs -f app` shows both
; processes, which is the whole point of merging them into one container.

[program:api]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app
; 127.0.0.1, not 0.0.0.0: nginx is the only thing that should reach the API,
; and only port 80 is published. Binding 0.0.0.0 here would expose uvicorn
; directly to anything that could reach the container.
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Start the API first so nginx isn't proxying to a dead socket on boot.
priority=10

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
