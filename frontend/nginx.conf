server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - client-side routing (none yet in v1, but this is free to have)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access in production: nginx forwards /api to the
    # backend container by its docker-compose service name, so the frontend
    # never needs VITE_API_BASE_URL set when both are deployed via compose.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
